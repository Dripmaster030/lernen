
name: Aurora Client JAR bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4

      - name: Minecraft Mod bauen
        run: gradle build --no-daemon

      - name: JAR zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AuroraClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
